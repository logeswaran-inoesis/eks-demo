name: Build, Push Docker Image & Deploy to EKS

on:
  push:
    branches:
      - "main"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repo
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Configure AWS credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 3. Login to ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      # 4. Build and tag Docker image
      - name: Build and Tag Docker Image
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}

      # 5. Push Docker image to ECR
      - name: Push Docker Image to ECR
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}

      # 6. Verify image in ECR
      - name: Verify Image in ECR
        run: |
          aws ecr describe-images --repository-name $ECR_REPOSITORY
        env:
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}

      # 7. Update Kubernetes deployment on EKS
      - name: Update Kubernetes Deployment
        run: |
          # Update kubeconfig
          aws eks update-kubeconfig --region ${{ secrets.AWS_REGION }} --name demo-eks-cluster

          # Detect container name dynamically
          CONTAINER_NAME=$(kubectl get deployment eks-demo-django -o jsonpath='{.spec.template.spec.containers[0].name}')

          # Set the new image
          kubectl set image deployment/eks-demo-django $CONTAINER_NAME=$ECR_REGISTRY/$ECR_REPOSITORY:latest

          # Wait for rollout to finish
          kubectl rollout status deployment/eks-demo-django
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
