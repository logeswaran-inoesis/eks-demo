apiVersion: apps/v1
kind: Deployment
metadata:
  name: eks-demo-django
  labels:
    app: eks-demo-django
spec:
  replicas: 2
  selector:
    matchLabels:
      app: eks-demo-django
  template:
    metadata:
      labels:
        app: eks-demo-django
    spec:
      containers:
      - name: django
