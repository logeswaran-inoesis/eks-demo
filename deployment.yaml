REPOSITORY                     TAG       IMAGE ID       CREATED         SIZE
eks-demo-django                prod      cd8c2d6110a0   5 minutes ago   273MB        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: django-config
        - secretRef:
            name: django-secret
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: eks-demo-django
spec:
  type: LoadBalancer
  selector:
    app: eks-demo-django
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
 
